services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestao_uep_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_uep_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - integration

  backend-integration:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: gestao_uep_test
      DB_USER: postgres
      DB_PASS: postgres
    depends_on:
      database:
        condition: service_healthy
    command: ["mvn", "--batch-mode", "verify", "-Pintegration"]
    networks:
      - integration

networks:
  integration:
    name: gestao-uep-integration
