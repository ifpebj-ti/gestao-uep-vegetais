name: CI/CD Pipeline

# Dispara a pipeline em eventos de push e pull request nas branches principais
on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # 1. Lint e Testes Automatizados
  # ============================================================
  code-quality:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      # Clona o repositorio no runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Executa a analise estatica de codigo (Lint)
      - name: Lint Check (Frontend & Backend)
        run: |
          echo "[INFO] Verificando estrutura e executando Lint..."
          # Integrar comandos reais de lint (ex: npm run lint) quando o codigo for adicionado
          echo "[SUCCESS] Lint concluido com sucesso."

      # Executa a suite de testes unitarios e de integracao
      - name: Run Main Tests
        run: |
          echo "[INFO] Executando testes principais..."
          # Integrar comandos reais de testes (ex: npm test) quando o codigo for adicionado
          echo "[SUCCESS] Suite de testes aprovada sem falhas."

  # ============================================================
  # 2. Build Multi-Arch (amd64/arm64), Varredura Trivy e GHCR
  # ============================================================
  docker-pipeline:
    name: Docker Build, Trivy Scan & GHCR Push
    needs: code-quality
    runs-on: ubuntu-latest
    # Estrategia de matriz para compilar frontend e backend em paralelo
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile

    # Permissoes necessarias para publicar no GitHub Packages e registrar relatorios de seguranca
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      # Clona o repositorio para o job do Docker
      - name: Checkout repository
        uses: actions/checkout@v4

      # Padroniza o nome da imagem em letras minusculas para compatibilidade com o GHCR
      - name: Normalizar nome da imagem
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }}-${{ matrix.service.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Configura QEMU para permitir emulacao de arquiteturas amd64 e arm64
      - name: Configurar QEMU (suporte a amd64 e arm64)
        uses: docker/setup-qemu-action@v3

      # Configura o driver Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autenticacao no GitHub Container Registry (apenas se nao for Pull Request)
      - name: Login no GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Realiza o build local da imagem para viabilizar a analise do Trivy
      - name: Build local image for security scan
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:temp-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Varredura de vulnerabilidades de seguranca com o Aqua Security Trivy
      # Falha a pipeline (exit-code: 1) caso encontre vulnerabilidades com severidade CRITICAL
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:temp-scan
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      # Gera as tags e metadados oficiais para a imagem
      - name: Extrair metadados do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Realiza o build final multi-arquitetura (amd64 e arm64) e publica no GHCR
      - name: Build & Push Multi-Arch Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max