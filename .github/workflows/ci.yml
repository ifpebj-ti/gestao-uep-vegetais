name: CI/CD Pipeline

# Dispara a pipeline em eventos de push e pull request nas branches principais
on:
  push:
    branches: [ "main", "master", "develop" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  REGISTRY: ghcr.io

# Cada job declara somente as permissões adicionais de que necessita.
permissions: {}

jobs:
  # ============================================================
  # 1. Lint e Testes Automatizados
  # ============================================================
  code-quality:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Clona o repositorio no runner
      - name: Checkout repository
        uses: actions/checkout@v7

      # Configura o ambiente Java para executar os testes do backend
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Executa os testes unitários do backend sem depender do PostgreSQL
      - name: Run Backend Tests & Coverage
        working-directory: ./backend
        run: mvn --batch-mode verify

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      # Configura o ambiente Node.js para o frontend
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Instala dependências limpas do Frontend
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high

      # Validação estática de tipagem e integridade do código
      - name: Frontend Lint & Type Check
        working-directory: ./frontend
        run: npm run lint

      # Executa a suíte de testes automatizados com Vitest
      - name: Run Frontend Tests & Coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

      # Valida compilação de produção e integridade dos bundles
      - name: Validate Frontend Build
        working-directory: ./frontend
        run: npm run build

  # ============================================================
  # 2. Build Multi-Arch (amd64/arm64), Varredura Trivy e GHCR
  # ============================================================
  docker-pipeline:
    name: Docker Build, Trivy Scan & GHCR Push
    needs: code-quality
    runs-on: ubuntu-latest
    # Estrategia de matriz para compilar frontend e backend em paralelo
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile

    # Permissoes necessarias para publicar no GitHub Packages e registrar relatorios de seguranca
    permissions:
      contents: read
      packages: write

    steps:
      # Clona o repositorio para o job do Docker
      - name: Checkout repository
        uses: actions/checkout@v7

      # Padroniza o nome da imagem em letras minusculas para compatibilidade com o GHCR
      - name: Normalizar nome da imagem
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }}-${{ matrix.service.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Configura QEMU para permitir emulacao de arquiteturas amd64 e arm64
      - name: Configurar QEMU (suporte a amd64 e arm64)
        uses: docker/setup-qemu-action@v4

      # Configura o driver Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Autenticacao no GitHub Container Registry (apenas se nao for Pull Request)
      - name: Login no GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Realiza o build local da imagem para viabilizar a analise do Trivy
      - name: Build local image for security scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:temp-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Varredura de vulnerabilidades de seguranca com o Aqua Security Trivy
      # Falha a pipeline (exit-code: 1) caso encontre vulnerabilidades HIGH ou CRITICAL corrigíveis
      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.75.0 image \
            --format table \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            "${IMAGE_NAME}:temp-scan"

      # Gera as tags e metadados oficiais para a imagem
      - name: Extrair metadados do Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      # Realiza o build final multi-arquitetura (amd64 e arm64) e publica no GHCR
      - name: Build & Push Multi-Arch Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
