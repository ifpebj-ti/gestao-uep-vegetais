name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/opc/gestao-uep-vegetais

            # Keep manually changed files recoverable instead of allowing them
            # to block the deployment or silently overwriting them.
            if [ -n "$(git status --porcelain)" ]; then
              backup_dir="/home/opc/gestao-uep-vegetais-deploy-backups/$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p "$backup_dir"
              git diff HEAD --binary > "$backup_dir/tracked-changes.patch"
              if [ -n "$(git ls-files --others --exclude-standard)" ]; then
                git ls-files --others --exclude-standard -z \
                  | tar --null --files-from=- -czf "$backup_dir/untracked-files.tar.gz"
              fi
              git stash push --include-untracked -m "deploy backup $(date -u +%Y%m%dT%H%M%SZ)"
            fi

            git pull --ff-only origin main
            docker compose config --quiet
            docker compose up -d --build --remove-orphans
            docker compose ps
